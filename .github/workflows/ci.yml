name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx oxlint

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Agent simulation
        run: npm run simulate

      - name: Accessibility audit
        run: npm run a11y
